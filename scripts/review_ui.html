<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pictile review</title>
<style>
  :root {
    --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --ok:#16a34a; --bad:#dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .topbar {
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:16px;
    padding:10px 18px; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .brand { font-weight:750; letter-spacing:.02em; white-space:nowrap; }
  .brand span { color:var(--muted); font-weight:500; }
  .topinfo { flex:1; display:flex; align-items:center; gap:16px; min-width:0; }
  .progresswrap { flex:1; max-width:560px; min-width:140px; }
  .progress { height:8px; background:var(--line); border-radius:999px; overflow:hidden; }
  #progressBar { height:100%; width:0; background:var(--accent); transition:width .2s; }
  #progressText { margin-top:3px; font-size:11px; }
  select {
    font:inherit; padding:7px 10px; border:1px solid var(--line);
    border-radius:9px; background:#fff;
  }
  main {
    max-width:1500px; margin:0 auto; padding:16px;
    display:grid; grid-template-columns:minmax(0,1fr) 360px;
    gap:16px; align-items:start;
  }
  .left { display:flex; flex-direction:column; gap:16px; min-width:0; }
  .images { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden;
  }
  .cardhead {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; border-bottom:1px solid #f0f0f0; font-size:13px; font-weight:600;
  }
  .imgbox {
    height:min(54vh,620px); display:flex; align-items:center; justify-content:center;
    padding:12px; background:#fafafa;
  }
  .imgbox img { max-width:100%; max-height:100%; object-fit:contain; }
  .thumbrow {
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-top:1px solid #f0f0f0;
  }
  .thumbbox {
    width:113px; height:113px; border:1px solid #d1d5db; border-radius:6px;
    background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .thumbbox img { max-width:100%; max-height:100%; }
  .review { padding:14px; }
  .imagemeta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px; }
  .chip {
    background:#f3f4f6; border:1px solid var(--line); border-radius:999px;
    padding:4px 9px; font-size:12px; white-space:nowrap;
  }
  h2 { font-size:15px; margin:14px 0 8px; }
  .scorebuttons { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .scorebtn {
    padding:12px 6px; border:1px solid #d1d5db; border-radius:10px; background:#fff;
    cursor:pointer; font-size:18px; font-weight:750; transition:box-shadow .15s, border-color .15s;
  }
  .scorebtn[data-score="1"] { color:#dc2626; }
  .scorebtn[data-score="2"] { color:#ea580c; }
  .scorebtn[data-score="3"] { color:#d97706; }
  .scorebtn[data-score="4"] { color:#16a34a; }
  .scorebtn[data-score="5"] { color:#15803d; }
  .scorebtn.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(37,99,235,.22); }
  .scoreinput { display:flex; align-items:center; gap:10px; margin-top:8px; }
  #scoreInput {
    width:92px; padding:8px 10px; border:1px solid #d1d5db; border-radius:8px; font:inherit;
  }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag {
    border:1px solid #d1d5db; background:#fff; border-radius:999px;
    padding:5px 9px; font-size:12px; cursor:pointer;
  }
  .tag.active { background:#dbeafe; border-color:#93c5fd; }
  textarea {
    width:100%; min-height:110px; padding:10px; border:1px solid #d1d5db;
    border-radius:10px; font:inherit; resize:vertical; line-height:1.5;
  }
  .actions { display:flex; gap:8px; margin-top:12px; }
  button {
    font:inherit; padding:10px 14px; border-radius:10px; border:1px solid #d1d5db;
    background:#fff; cursor:pointer;
  }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); flex:1; font-weight:650; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .status { margin-top:10px; font-size:13px; min-height:20px; }
  .status.error { color:var(--bad); }
  .status.ok { color:var(--ok); }
  .acceptance {
    position:sticky; top:70px; max-height:calc(100vh - 86px); overflow:auto; padding:14px;
  }
  .acceptance h3 { font-size:13px; margin:12px 0 5px; }
  .acceptance ul { margin:0; padding-left:18px; }
  .acceptance li { font-size:12.5px; line-height:1.55; color:#374151; margin:3px 0; }
  .confignote { font-size:11px; color:var(--muted); margin-top:12px; border-top:1px dashed var(--line); padding-top:8px; }
  .details { padding:14px; }
  .links { display:flex; gap:12px; margin-bottom:8px; }
  .links a { color:var(--accent); text-decoration:none; font-size:13px; }
  .links a:hover { text-decoration:underline; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #f0f0f0; }
  th { color:var(--muted); font-weight:600; }
  .swatch {
    width:18px; height:18px; border-radius:4px; border:1px solid rgba(0,0,0,.15);
    display:inline-block; vertical-align:middle;
  }
  .muted { color:var(--muted); font-weight:400; font-size:12px; }
  .disabled { opacity:.45; pointer-events:none; }
  .empty { padding:42px 18px; text-align:center; color:var(--muted); }
  @media (max-width:1100px) {
    main { grid-template-columns:1fr; }
    .acceptance { position:static; max-height:none; }
  }
  @media (max-width:760px) {
    .images { grid-template-columns:1fr; }
    .topbar { flex-wrap:wrap; }
    .topinfo { order:3; width:100%; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">pictile <span>review</span></div>
  <div class="topinfo">
    <div id="batchTitle" class="muted"></div>
    <div class="progresswrap">
      <div class="progress"><div id="progressBar"></div></div>
      <div id="progressText" class="muted"></div>
    </div>
  </div>
  <select id="filter">
    <option value="unreviewed">只看未评</option>
    <option value="all">全部</option>
    <option value="positive">只看正例</option>
    <option value="hard">只看硬负例</option>
  </select>
</header>

<main>
  <div class="left">
    <div class="images">
      <section class="card">
        <div class="cardhead"><span>原图</span><span id="origSize" class="muted"></span></div>
        <div class="imgbox"><img id="original" alt="原图"></div>
      </section>
      <section class="card">
        <div class="cardhead"><span>处理后</span><span id="gridLabel" class="muted"></span></div>
        <div class="imgbox"><img id="processed" alt="处理后"></div>
        <div class="thumbrow">
          <div class="thumbbox"><img id="thumb" alt="3cm 预览"></div>
          <div class="muted">≈3cm 观看尺寸</div>
        </div>
      </section>
    </div>

    <section class="review card">
      <div id="imageMeta" class="imagemeta"></div>
      <h2>评分 <span class="muted">1–5，先看 3cm 预览</span></h2>
      <div id="scoreButtons" class="scorebuttons"></div>
      <div class="scoreinput">
        <input id="scoreInput" type="number" min="1" max="5" step="1" placeholder="1–5">
        <span id="scoreLabel" class="muted"></span>
      </div>
      <h2>失败标签 <span class="muted">可选</span></h2>
      <div id="tagButtons" class="tags"></div>
      <h2>备注</h2>
      <textarea id="notes" placeholder="具体描述问题，例如：眼睛丢了、背景噪点多、文字糊……"></textarea>
      <div class="actions">
        <button id="prevBtn">← 上一张</button>
        <button id="confirmBtn" class="primary">确认并下一张</button>
        <button id="nextBtn">下一张 →</button>
      </div>
      <div id="status" class="status muted"></div>
      <div class="muted" style="margin-top:6px;font-size:12px;">
        快捷键：1–5 打分 · Enter 确认 · ←/→ 切换。确认后写入结构化 JSON 和 rating.csv；未确认的草稿暂存在浏览器本地。
      </div>
    </section>

    <section class="card details">
      <h2>颜色与文件</h2>
      <div id="links" class="links"></div>
      <div><table id="colors">
        <thead><tr><th>色号</th><th>色块</th><th>HEX</th><th>格数</th><th>豆数</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>
  </div>

  <aside class="acceptance card">
    <h2 id="acceptanceHeadline">验收标准</h2>
    <div id="acceptanceSections"></div>
    <div id="configNote" class="confignote"></div>
  </aside>
</main>

<script>
const TAG_LABELS = {
  eye_lost: "眼睛丢失",
  text_unreadable: "文字糊",
  outline_blur: "轮廓糊",
  island_noise: "噪点/孤立点",
  skin_shift: "肤色偏",
  banding: "色阶断裂",
  background_clutter: "背景杂乱",
  subject_too_small: "主体太小",
  thin_line_lost: "细线丢失",
  color_shift: "偏色",
  detail_lost: "细节丢失",
  other: "其他"
};

const state = {
  config: null,
  images: [],
  filter: "unreviewed",
  index: 0,
  current: null,
  score: null,
  tags: new Set(),
  saving: false
};

const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function draftKey(img) {
  return `pictile-review:${state.config.batch}:${img.image_id}`;
}

function saveDraft() {
  const img = state.current;
  if (!img) return;
  const data = { score: state.score, notes: $("notes").value, tags: [...state.tags] };
  if (data.score || data.notes || data.tags.length) {
    localStorage.setItem(draftKey(img), JSON.stringify(data));
  } else {
    localStorage.removeItem(draftKey(img));
  }
}

function loadDraft(img) {
  try {
    return JSON.parse(localStorage.getItem(draftKey(img)) || "null");
  } catch (e) {
    return null;
  }
}

function filtered() {
  const f = state.filter;
  return state.images.filter(img => {
    if (f === "unreviewed") return !img.review;
    if (f === "positive") return img.group_key === "positive";
    if (f === "hard") return img.group_key === "hard_negative";
    return true;
  });
}

function updateProgress() {
  const total = state.images.length;
  const reviewed = state.images.filter(i => i.review).length;
  $("progressText").textContent = `已评 ${reviewed} / ${total}`;
  $("progressBar").style.width = total ? `${(reviewed / total) * 100}%` : "0";
}

function status(msg, kind="muted") {
  const el = $("status");
  el.className = "status " + (kind === "muted" ? "muted" : kind);
  el.textContent = msg;
}

function renderScore() {
  document.querySelectorAll(".scorebtn").forEach(btn => {
    btn.classList.toggle("active", Number(btn.dataset.score) === state.score);
  });
  $("scoreInput").value = state.score || "";
  const label = state.config.score_labels[String(state.score)] || "";
  $("scoreLabel").textContent = label;
}

function setScore(v) {
  v = Number(v);
  if (!(v >= 1 && v <= 5)) return;
  state.score = v;
  renderScore();
  saveDraft();
}

function renderTags() {
  document.querySelectorAll(".tag").forEach(btn => {
    btn.classList.toggle("active", state.tags.has(btn.dataset.tag));
  });
}

function toggleTag(tag) {
  if (state.tags.has(tag)) state.tags.delete(tag);
  else state.tags.add(tag);
  renderTags();
  saveDraft();
}

function renderMeta(img) {
  const m = img.metrics || {};
  const chips = [
    img.image_id,
    img.group,
    img.type,
    m.grid ? `${m.grid[0]}×${m.grid[1]}` : null,
    m.colors_used != null ? `${m.colors_used} 色` : null,
    m.beads_total != null ? `${m.beads_total} 颗（含 10% 损耗）` : null,
    m.delta_e_p95 != null ? `ΔE P95 ${Number(m.delta_e_p95).toFixed(1)}` : null,
    m.total_ms != null ? `${Math.round(m.total_ms)} ms` : null,
  ].filter(Boolean);
  $("imageMeta").innerHTML = chips.map(c => `<span class="chip">${esc(c)}</span>`).join("");

  $("origSize").textContent = img.orig_size ? `${img.orig_size[0]}×${img.orig_size[1]}` : "";
  $("gridLabel").textContent = m.grid ? `${m.grid[0]}×${m.grid[1]} · ${m.colors_used} 色` : "";
}

function renderColors(img) {
  const tbody = $("colors").querySelector("tbody");
  const rows = (img.colors || []).map(c => `
    <tr>
      <td>${esc(c.code)}</td>
      <td><span class="swatch" style="background:${esc(c.hex)}"></span></td>
      <td>${esc(c.hex)}</td>
      <td>${esc(c.cells)}</td>
      <td>${esc(c.beads)}</td>
    </tr>`).join("");
  tbody.innerHTML = rows || `<tr><td colspan="5" class="muted">无颜色数据</td></tr>`;
}

function renderLinks(img) {
  const links = [];
  if (img.pdf_url) links.push(`<a href="${esc(img.pdf_url)}" target="_blank" rel="noopener">打开 PDF</a>`);
  if (img.csv_url) links.push(`<a href="${esc(img.csv_url)}" target="_blank" rel="noopener">打开用量 CSV</a>`);
  $("links").innerHTML = links.join("");
}

function emptyState(message) {
  state.current = null;
  $("original").removeAttribute("src");
  $("processed").removeAttribute("src");
  $("thumb").removeAttribute("src");
  $("imageMeta").innerHTML = "";
  $("origSize").textContent = "";
  $("gridLabel").textContent = "";
  $("links").innerHTML = "";
  $("colors").querySelector("tbody").innerHTML = "";
  $("scoreInput").value = "";
  $("scoreInput").disabled = true;
  $("confirmBtn").disabled = true;
  $("prevBtn").disabled = true;
  $("nextBtn").disabled = true;
  document.querySelectorAll(".scorebtn,.tag").forEach(b => b.classList.add("disabled"));
  status(message);
}

function render() {
  updateProgress();
  const list = filtered();
  if (!list.length) {
    emptyState(state.filter === "unreviewed" ? "全部已评。切到“全部”可以回看或修改。" : "没有符合条件的图片。");
    return;
  }
  if (state.index >= list.length) state.index = list.length - 1;
  if (state.index < 0) state.index = 0;
  const img = list[state.index];
  state.current = img;

  $("scoreInput").disabled = false;
  $("confirmBtn").disabled = false;
  $("prevBtn").disabled = false;
  $("nextBtn").disabled = false;
  document.querySelectorAll(".scorebtn,.tag").forEach(b => b.classList.remove("disabled"));

  $("original").src = img.original_url;
  $("processed").src = img.preview_url;
  $("thumb").src = img.preview_url;
  renderMeta(img);
  renderColors(img);
  renderLinks(img);

  const draft = loadDraft(img);
  const r = draft || img.review || {};
  state.score = r.score ? Number(r.score) : null;
  state.tags = new Set(r.failure_tags || r.tags || []);
  $("notes").value = r.notes || "";
  renderScore();
  renderTags();

  $("batchTitle").textContent = `${state.config.title} · ${state.config.batch} · ${state.index + 1}/${list.length}`;
  if (img.review) {
    status(`已评：${img.review.score} 分`, "ok");
  } else if (draft) {
    status("有未确认草稿");
  } else {
    status("未评");
  }
}

async function go(delta) {
  const list = filtered();
  if (!list.length) return;
  state.index = Math.max(0, Math.min(state.index + delta, list.length - 1));
  render();
}

async function confirm() {
  const img = state.current;
  if (!img || state.saving) return;
  if (!state.score) {
    status("请先选择 1–5 分", "error");
    return;
  }
  state.saving = true;
  $("confirmBtn").disabled = true;
  status("保存中…");
  const payload = {
    image_id: img.image_id,
    score: state.score,
    notes: $("notes").value.trim(),
    failure_tags: [...state.tags]
  };
  try {
    const res = await fetch("/api/review", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "保存失败");
    img.review = { score: payload.score, notes: payload.notes, failure_tags: payload.failure_tags };
    localStorage.removeItem(draftKey(img));
    status("已保存", "ok");
    updateProgress();

    if (state.filter === "unreviewed") {
      const after = filtered();
      if (!after.length) {
        state.index = 0;
      } else {
        state.index = Math.min(state.index, after.length - 1);
      }
    } else {
      const list = filtered();
      state.index = Math.min(state.index + 1, list.length - 1);
    }
    render();
  } catch (e) {
    status("保存失败：" + e.message, "error");
  } finally {
    state.saving = false;
    $("confirmBtn").disabled = false;
  }
}

function renderAcceptance() {
  const a = state.config.acceptance || {};
  $("acceptanceHeadline").textContent = a.headline || "验收标准";
  $("acceptanceSections").innerHTML = (a.sections || []).map(s => `
    <section>
      <h3>${esc(s.title)}</h3>
      <ul>${(s.items || []).map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    </section>`).join("");
  $("configNote").textContent = `验收文本来自 ${state.config.config_rel || "review_config.json"}；换批次只改这个文件，不改前端。`;
}

function buildControls() {
  const sb = $("scoreButtons");
  sb.innerHTML = "";
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button");
    b.className = "scorebtn";
    b.dataset.score = i;
    b.textContent = i;
    b.title = state.config.score_labels[String(i)] || "";
    b.addEventListener("click", () => setScore(i));
    sb.appendChild(b);
  }

  const tb = $("tagButtons");
  tb.innerHTML = "";
  (state.config.failure_tags || []).forEach(tag => {
    const b = document.createElement("button");
    b.className = "tag";
    b.dataset.tag = tag;
    b.textContent = TAG_LABELS[tag] || tag;
    b.title = tag;
    b.addEventListener("click", () => toggleTag(tag));
    tb.appendChild(b);
  });
}

async function init() {
  status("加载中…");
  try {
    const res = await fetch("/api/config");
    if (!res.ok) throw new Error("无法读取配置");
    state.config = await res.json();
    state.images = state.config.images || [];
    renderAcceptance();
    buildControls();

    $("scoreInput").addEventListener("input", e => {
      const v = Number(e.target.value);
      if (v >= 1 && v <= 5) setScore(v);
    });
    $("notes").addEventListener("input", saveDraft);
    $("notes").addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        confirm();
      }
    });
    $("confirmBtn").addEventListener("click", confirm);
    $("prevBtn").addEventListener("click", () => go(-1));
    $("nextBtn").addEventListener("click", () => go(1));
    $("filter").addEventListener("change", e => {
      state.filter = e.target.value;
      state.index = 0;
      render();
    });

    document.addEventListener("keydown", e => {
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if (e.key >= "1" && e.key <= "5") {
        e.preventDefault();
        setScore(Number(e.key));
      } else if (e.key === "Enter") {
        e.preventDefault();
        confirm();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        go(-1);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        go(1);
      }
    });

    render();
  } catch (e) {
    status("加载失败：" + e.message, "error");
    emptyState("加载失败：" + e.message);
  }
}

init();
</script>
</body>
</html>
